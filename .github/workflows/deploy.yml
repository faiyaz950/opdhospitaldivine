name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: ssh-keyscan from runners gets dropped by the host's connection limits.
          echo "cpanel-host ssh-rsa " > ~/.ssh/known_hosts

      # No --delete: config.local.php and any server-only files must survive deploys.
      - name: Upload files
        run: |
          for i in 1 2 3 4 5; do
            rsync -az \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '.gitignore' \
              --exclude 'DLL/config.local.php' \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o HostKeyAlias=cpanel-host -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
              ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/" && exit 0
            sleep $((i * 5))
          done
          exit 1
